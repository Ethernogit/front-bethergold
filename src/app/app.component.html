<router-outlet></router-outlet>
<app-toast></app-toast>

<!-- Avisos flotantes: arriba al centro, para no chocar con los toasts (abajo a la derecha) ni mover el layout -->
@if (versionCheck.updateAvailable() || showChromeNotice()) {
<div class="fixed top-3 left-1/2 -translate-x-1/2 z-[9999998] flex w-[calc(100%-2rem)] max-w-xl flex-col gap-2">
  @if (versionCheck.updateAvailable()) {
  <div role="status"
    class="flex items-center gap-3 rounded-2xl border border-[#E8D9A0] bg-white px-4 py-3 shadow-theme-lg dark:border-[#4A474D] dark:bg-[#232126]">
    <div class="flex size-9 shrink-0 items-center justify-center rounded-xl bg-[#FBF0C9] text-[#C69214] dark:bg-[#4A474D] dark:text-[#FAC600]">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
    </div>
    <p class="min-w-0 flex-1 font-instrument text-theme-sm text-[#46424A] dark:text-gray-300">
      <span class="font-bold text-[#191817] dark:text-white">Hay una nueva versión.</span>
      Actualiza para ver los últimos cambios.
    </p>
    <button type="button" (click)="versionCheck.reload()"
      class="shrink-0 rounded-xl bg-gradient-to-br from-[#C69214] to-[#FAC600] px-4 py-2 font-instrument text-sm font-semibold text-[#191817] shadow-theme-sm transition-all hover:from-[#9A6F0A] hover:to-[#C69214] active:scale-[0.98]">
      Actualizar
    </button>
  </div>
  }

  @if (showChromeNotice()) {
  <div role="note"
    class="flex items-center gap-3 rounded-2xl border border-[#E8D9A0] bg-[#FFFDF7] px-4 py-3 shadow-theme-lg dark:border-[#4A474D] dark:bg-[#232126]">
    <div class="flex size-9 shrink-0 items-center justify-center rounded-xl bg-[#FBF0C9] text-[#C69214] dark:bg-[#4A474D] dark:text-[#FAC600]">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </div>
    <p class="min-w-0 flex-1 font-instrument text-theme-sm text-[#46424A] dark:text-gray-300">
      Para una mejor experiencia, te recomendamos usar
      <span class="font-bold text-[#191817] dark:text-white">Google Chrome</span>.
    </p>
    <button type="button" (click)="dismissChromeNotice()"
      class="shrink-0 rounded-xl border border-[#E8D9A0] bg-white px-3 py-2 font-instrument text-sm font-medium text-[#46424A] transition-all hover:bg-[#FBF0C9] dark:border-[#4A474D] dark:bg-[#3a383d] dark:text-gray-300 dark:hover:bg-[#4A474D]">
      Entendido
    </button>
  </div>
  }
</div>
}
